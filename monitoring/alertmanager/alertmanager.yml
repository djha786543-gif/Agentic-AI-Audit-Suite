global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.com:587
  smtp_from: acap-alerts@example.com
  smtp_auth_username: acap-alerts@example.com
  smtp_auth_password: change-me

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: webhook-default
  routes:
    - matchers:
        - severity="critical"
      receiver: webhook-critical
    - matchers:
        - severity="warning"
      receiver: webhook-warning
    - matchers:
        - severity="critical"
      receiver: email-critical

receivers:
  - name: webhook-default
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts/default
        send_resolved: true

  - name: webhook-critical
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts/critical
        send_resolved: true

  - name: webhook-warning
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts/warning
        send_resolved: true

  - name: email-critical
    email_configs:
      - to: security-ops@example.com
        send_resolved: true

templates: []
