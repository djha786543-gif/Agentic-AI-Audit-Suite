groups:
  - name: acap-api-alerts
    rules:
      - alert: AcapApiHigh5xxErrorRate
        expr: |
          (
            sum(rate(acap_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(acap_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: acap-api
        annotations:
          summary: "ACAP API high 5xx error rate"
          description: "5xx ratio has exceeded 5% for at least 5 minutes."

      - alert: AcapApiHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(acap_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          service: acap-api
        annotations:
          summary: "ACAP API high p95 latency"
          description: "p95 latency is above 1.5s for at least 10 minutes."

      - alert: AcapApiNoTraffic
        expr: sum(rate(acap_http_requests_total[10m])) < 0.001
        for: 15m
        labels:
          severity: info
          service: acap-api
        annotations:
          summary: "ACAP API near-zero traffic"
          description: "No meaningful traffic observed for 15 minutes. Validate ingress and upstream routing."
